<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Companion</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>Local Companion</h1>
                <div class="state-badge" id="state-badge">
                    <span class="state-dot" id="state-dot"></span>
                    <span id="state-text">ARMED</span>
                </div>
            </div>
            <div class="header-controls">
                <select class="mode-select" id="mode-select" onchange="changeMode()">
                    <option value="demo">Demo Mode (basic commands)</option>
                    <option value="local_ai">Local AI Mode (conversation)</option>
                </select>
                <button class="btn btn-secondary" id="tts-btn" onclick="toggleTTS()">TTS: Off</button>
                <button class="btn btn-mute" id="mute-btn" onclick="toggleMute()">Mute</button>
            </div>
        </header>

        <div class="main-grid">
            <!-- Command Input -->
            <div class="card command-section">
                <div class="card-title">Command <button class="btn-clear" onclick="clearHistory()">Clear History</button></div>
                <div class="input-group">
                    <input type="text" id="command-input"
                           placeholder='Ask a question or say "remember my meeting is Monday at 3 PM"'
                           autocomplete="off">
                    <button class="btn btn-primary" id="send-btn" onclick="sendCommand()">
                        Send
                        <span class="spinner" id="send-spinner"></span>
                    </button>
                </div>
                <div class="audio-controls">
                    <div class="audio-row">
                        <button class="btn btn-record" id="record-btn" onclick="toggleRecording()">
                            <span class="record-dot" id="record-dot"></span>
                            <span id="record-label">Record</span>
                        </button>
                        <button class="btn btn-continuous" id="continuous-btn" onclick="toggleContinuous()">
                            Continuous: Off
                        </button>
                        <span class="record-status" id="record-status"></span>
                    </div>
                    <div class="audio-row">
                        <label for="audio-file" class="btn btn-secondary audio-label">
                            <span id="audio-filename">Choose audio file...</span>
                        </label>
                        <input type="file" id="audio-file" accept=".wav" onchange="handleAudioSelect()">
                        <button class="btn btn-secondary" onclick="uploadAudio()">
                            Upload
                            <span class="spinner" id="audio-spinner"></span>
                        </button>
                    </div>
                </div>
                <div class="conversation-history" id="conversation-history">
                    <div class="empty-state" id="conversation-empty">Start a conversation with your companion.</div>
                </div>
            </div>

            <!-- Memories -->
            <div class="card">
                <div class="card-title">Memories</div>
                <div class="memory-list" id="memory-list">
                    <div class="empty-state">No memories saved yet.</div>
                </div>
            </div>

            <!-- Tasks -->
            <div class="card">
                <div class="card-title">Tasks</div>
                <div class="task-list" id="task-list">
                    <div class="empty-state">No tasks yet.</div>
                </div>
            </div>

            <!-- Network Events -->
            <div class="card" style="grid-column: 1 / -1;">
                <div class="card-title">Network Events</div>
                <div class="event-list" id="event-list">
                    <div class="empty-state">No network events recorded.</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js?v=continuous-voice-tts-4"></script>
</body>
</html>
